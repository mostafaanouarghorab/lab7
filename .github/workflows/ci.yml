name: Security CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: |
          docker build --pull -t lab7-app:ci \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" ./app
          docker save -o "$RUNNER_TEMP/lab7.tar" lab7-app:ci
      - name: Smoke test
        run: |
          docker run -d --name lab7-ci --read-only --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:8080:8080 lab7-app:ci
          trap 'docker logs lab7-ci; docker rm -f lab7-ci' EXIT
          test "$(curl -fsS --retry 10 --retry-all-errors http://127.0.0.1:8080/health)" = OK
          curl -fsS http://127.0.0.1:8080/ | grep -F 'Laboratoire 7'
      - name: Image report
        id: report
        run: |
          docker run --rm -v "$RUNNER_TEMP/lab7.tar:/input/lab7.tar:ro" -v lab7-trivy:/root/.cache/trivy \
            "$TRIVY_IMAGE" image --input /input/lab7.tar --scanners vuln \
            --severity MEDIUM,HIGH,CRITICAL --exit-code 0
      - name: Scan manifests
        if: ${{ !cancelled() && steps.report.outcome != 'skipped' }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/kubernetes:/manifests:ro" \
            -v lab7-trivy:/root/.cache/trivy "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL --exit-code 1 /manifests
      - name: Image gate
        if: ${{ !cancelled() && steps.report.outcome == 'success' }}
        run: |
          docker run --rm -v "$RUNNER_TEMP/lab7.tar:/input/lab7.tar:ro" -v lab7-trivy:/root/.cache/trivy \
            "$TRIVY_IMAGE" image --input /input/lab7.tar --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && vars.PUBLISH == 'true'
        with:
          name: scanned-image
          path: ${{ runner.temp }}/lab7.tar
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: scanned-image
          path: ${{ runner.temp }}
      - name: Publish scanned image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          IMAGE="$REPOSITORY:$GITHUB_SHA"
          printf '%s\n' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker load -i "$RUNNER_TEMP/lab7.tar"
          docker tag lab7-app:ci "$IMAGE"
          docker push "$IMAGE"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))')
          printf 'Tag: %s\n\nPublished: %s@%s\n' "$IMAGE" "$REPOSITORY" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
