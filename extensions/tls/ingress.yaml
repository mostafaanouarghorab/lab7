apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lab7-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [app.lab.test]
      secretName: lab7-tls
  rules:
    - host: app.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lab7-app
                port:
                  number: 80
